name: Uploader checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go mod verify
      - name: Test with Windows race detector
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - name: Check Go formatting
        run: |
          $files = gofmt -l cmd internal scripts
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
          if ($files) { throw "Run gofmt on: $files" }
      - run: ./scripts/build.ps1 -AllowUnconfigured
      - run: ./scripts/verify-build.ps1
      - name: Verify explicitly injected synthetic origin
        env:
          LLVY_SERVER_ORIGIN: https://uploader.example.invalid
        run: |
          ./scripts/build.ps1
          ./scripts/verify-build.ps1
