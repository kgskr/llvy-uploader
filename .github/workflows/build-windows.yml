name: Build Windows artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go mod verify
      - name: Test common code with Linux race detector
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - name: Check Go formatting
        run: |
          files=$(gofmt -l cmd internal scripts)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
  build:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      LLVY_SERVER_ORIGIN: ${{ vars.LLVY_SERVER_ORIGIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Require configured HTTPS server origin
        run: go run ./scripts/validate-origin
      - run: go mod verify
      - name: Test with Windows race detector
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - run: ./scripts/build.ps1
      - run: ./scripts/verify-build.ps1
      - name: Store unsigned Windows build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: llvy-uploader-windows-x64-${{ github.sha }}
          path: |
            dist/llvy-uploader.exe
            dist/SHA256SUMS.txt
            dist/build-info.txt
            dist/provenance.txt
          if-no-files-found: error
          retention-days: 30
