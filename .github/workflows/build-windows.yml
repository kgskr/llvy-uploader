name: Build Windows artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go mod verify
      - name: Test common code with Linux race detector
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - name: Check Go formatting
        run: |
          files=$(gofmt -l cmd internal scripts)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
  build:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      LLVY_SERVER_ORIGIN: ${{ vars.LLVY_SERVER_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Require configured HTTPS server origin
        run: go run ./scripts/validate-origin
      - run: go mod verify
      - name: Test with Windows race detector
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - run: ./scripts/build.ps1
      - run: ./scripts/verify-build.ps1
      - name: Store unsigned Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvy-uploader-windows-x64-${{ github.sha }}
          path: |
            dist/llvy-uploader.exe
            dist/SHA256SUMS.txt
            dist/build-info.txt
            dist/provenance.txt
          if-no-files-found: error
          retention-days: 30
          archive: true
